<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Lelum Jayasooriya</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --text-light: #86868b;
        --brand: #007aff;
        --brand-light: #7cc8ff;
        --primary: #000000;
        --inverse: #ffffff;
        --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
        --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --surface: #1d1d1f;
          --text: #f5f5f7;
          --text-light: #a1a1a6;
          --primary: #ffffff;
          --inverse: #000000;
          --shadow-soft: 0 10px 30px rgba(255, 255, 255, 0.05);
          --shadow-hover: 0 20px 40px rgba(255, 255, 255, 0.1);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow: hidden;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .badge {
        position: relative;
        width: clamp(220px, 28vw, 280px);
        height: clamp(220px, 28vw, 280px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.5rem;
        isolation: isolate;
      }
      .badge-aurora {
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%,
            rgba(124, 200, 255, 0.8) 0%,
            rgba(0, 122, 255, 0.55) 40%,
            rgba(0, 122, 255, 0.2) 65%,
            rgba(0, 122, 255, 0) 82%);
        filter: blur(18px);
        opacity: 0.75;
        z-index: -2;
        animation: pulse 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%   { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1.04); opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        .badge-aurora { animation: none; }
      }
      .badge-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--surface);
        box-shadow:
          0 0 0 6px rgba(255, 255, 255, 0.65),
          0 0 0 7px rgba(255, 255, 255, 0.35),
          0 24px 60px rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (prefers-color-scheme: dark) {
        .badge-frame {
          box-shadow:
            0 0 0 6px rgba(255, 255, 255, 0.06),
            0 0 0 7px rgba(255, 255, 255, 0.03),
            0 24px 60px rgba(0, 0, 0, 0.5);
        }
      }
      .code {
        font-size: clamp(4.5rem, 12vw, 6.5rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-size: clamp(2.25rem, 6vw, 3.75rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.035em;
        max-width: 14ch;
        margin-bottom: 0.25rem;
      }
      p {
        color: var(--text-light);
        font-size: 1.05rem;
        line-height: 1.55;
        max-width: 44ch;
        margin-bottom: 1rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.85rem 1.85rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 500;
        font-size: 1rem;
        transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--inverse);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(125, 125, 125, 0.3);
      }
      .btn-secondary:hover {
        border-color: var(--brand);
        color: var(--brand);
      }
      .btn-secondary span {
        transition: transform 0.25s ease;
      }
      .btn-secondary:hover span {
        transform: translateX(3px);
      }
      @media (max-width: 640px) {
        h1 { font-size: clamp(1.75rem, 8vw, 2.5rem); }
        .badge { width: 180px; height: 180px; }
        .code { font-size: 4rem; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="badge">
        <div class="badge-aurora" aria-hidden="true"></div>
        <div class="badge-frame">
          <div class="code">404</div>
        </div>
      </div>
      <h1>This page took a wrong turn.</h1>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
      </div>
    </main>
  </body>
</html>
